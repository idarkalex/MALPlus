name: "💡 Feature Request / Suggestion"
description: "Suggest a new feature, improvement, or idea for MAL+"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are welcome! Please check [open issues](https://github.com/idarkalex/MALPlus/issues) first to see if someone has already suggested something similar.

  - type: dropdown
    id: platform
    attributes:
      label: "Target Platform"
      options:
        - "Both / General"
        - "Android"
        - "Windows"
      default: 0
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: "What would you like to see?"
      description: "Describe the feature or improvement and why it would be useful. Feel free to paste mockups, screenshots, or reference links below."
      placeholder: "I'd love to be able to..."
    validations:
      required: true
