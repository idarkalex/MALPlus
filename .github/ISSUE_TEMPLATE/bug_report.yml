name: "🐛 Bug Report"
description: "Report a bug, crash, or unexpected behavior in MAL+"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Before submitting, please make sure you're on the [latest release](https://github.com/idarkalex/MALPlus/releases/latest) and check [open issues](https://github.com/idarkalex/MALPlus/issues) to avoid duplicates.

  - type: dropdown
    id: platform
    attributes:
      label: "Platform"
      options:
        - "Android"
        - "Windows"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "App Version & Device / OS"
      description: "Check Settings > ABOUT for the version (legacy 1.x versions are not supported)."
      placeholder: "e.g., 0.7.7 · Pixel 8 (Android 15) or 0.7.7 · Windows 11"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: "What happened & how to reproduce"
      description: "Describe the bug, how to trigger it, and what you expected (if not obvious)."
      placeholder: |
        1. Go to ...
        2. Tap on ...
        3. App crashes / shows ...
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: "Logs or Screenshots (Optional)"
      description: |
        Drag & drop screenshots/videos, or attach the `.txt` file from **Settings > DIAGNOSTICS & LOGS > Export logs** *(tokens/passwords are redacted automatically)*.
      placeholder: "Paste log snippets or drag & drop files here..."
    validations:
      required: false
