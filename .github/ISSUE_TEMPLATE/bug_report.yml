name: "🐛 Bug Report"
description: "Report a bug, error, or unexpected behavior in MAL+"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this issue! Before submitting:
        1. Ensure you are running **version 0.7.0 or higher**. Previous versions (1.x Xamarin) are legacy and no longer supported.
        2. Check the [Open Issues](https://github.com/idarkalex/MALPlus/issues) to see if this has already been reported.

  - type: input
    id: app_version
    attributes:
      label: "MAL+ Version (Minimum 0.7.0)"
      description: "Found under Settings > UPDATES or ABOUT."
      placeholder: "e.g., 0.7.0 (Build 201)"
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: "Device Model"
      description: "Physical device manufacturer and model."
      placeholder: "e.g., Google Pixel 8, Samsung Galaxy S24, Xiaomi 13"
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: "Android Version / API"
      description: "Operating system version."
      placeholder: "e.g., Android 14 (API 34), Android 15"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "Explain clearly what happens."
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the behavior."
      placeholder: |
        1. Go to 'Anime' tab
        2. Tap on 'Fire Force'
        3. Switch to 'Episodes' tab
        4. Observe the issue
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: diagnostics_logs
    attributes:
      label: "Diagnostic Logs (Recommended)"
      description: |
        Navigate to **Settings > DIAGNOSTICS & LOGS > Export logs**, save the `.txt` report, and attach it here or paste relevant log lines.
        *(Logs are strictly local and automatically redact tokens and passwords).*
      placeholder: "Paste relevant log snippets here or attach the exported diagnostic report..."
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots or Screen Recordings"
      description: "Drag and drop media files illustrating the issue."
    validations:
      required: false
